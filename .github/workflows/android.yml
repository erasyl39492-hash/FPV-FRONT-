name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.158.0
          cp node_modules/three/build/three.min.js www/three.min.js
          echo '{"appId":"com.fpvfront.game","appName":"FPV FRONT","webDir":"www","backgroundColor":"#101820"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fpv-front-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
